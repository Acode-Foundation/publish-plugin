name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: shellcheck publish.sh test/run.sh
      - name: Run tests
        run: bash test/run.sh
